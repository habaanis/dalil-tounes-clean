name: Validate C-04 media limits

on:
  push:
    branches: [ux-c04-media-limits-20260825]

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-c04-media-limits-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Align media limits with current offer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/subscriptionTiers.ts')
          s = p.read_text()
          s = s.replace(' * - Artisan: 3 photos max', ' * - Artisan: 5 photos max', 1)
          s = s.replace(' * - Premium: 5 photos max, 1 vidéo', ' * - Premium: 10 photos max, 1 vidéo', 1)
          old = """    case 'artisan':\n      return {\n        maxPhotos: 3,\n        maxVideos: 0,\n        showGallery: true,\n        showVideos: false,\n      };\n    case 'premium':\n      return {\n        maxPhotos: 5,\n        maxVideos: 1,\n        showGallery: true,\n        showVideos: true,\n      };\n"""
          new = """    case 'artisan':\n      return {\n        maxPhotos: 5,\n        maxVideos: 0,\n        showGallery: true,\n        showVideos: false,\n      };\n    case 'premium':\n      return {\n        maxPhotos: 10,\n        maxVideos: 1,\n        showGallery: true,\n        showVideos: true,\n      };\n"""
          if old not in s:
              raise SystemExit('Media limits block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - run: npm run build
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/subscriptionTiers.ts
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "ux: align CV Business photo limits with current offer"
            git push origin HEAD:ux-c04-media-limits-20260825
          fi

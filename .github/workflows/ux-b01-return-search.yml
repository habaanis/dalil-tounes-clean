name: UX B-01 return to search

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.head_ref == 'ux-b01-return-search-20260825'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply B-01 fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/BusinessDetail.tsx')
          s = p.read_text()
          old1 = """    const handleBack = onClose || onNavigateBack || (() => {\n      const parentPath = routerLocation.pathname.split('/').slice(0, -1).join('/') || '/';\n      navigate(parentPath);\n    });"""
          new1 = """    const handleBack = onClose || onNavigateBack || (() => {\n      const historyIndex = Number(window.history.state?.idx);\n      if (Number.isFinite(historyIndex) && historyIndex > 0) {\n        navigate(-1);\n        return;\n      }\n      navigate('/entreprises');\n    });"""
          old2 = """  const handleClose = onClose || onNavigateBack || (() => {\n    const parentPath = routerLocation.pathname.split('/').slice(0, -1).join('/') || '/';\n    navigate(parentPath);\n  });"""
          new2 = """  const handleClose = onClose || onNavigateBack || (() => {\n    const historyIndex = Number(window.history.state?.idx);\n    if (Number.isFinite(historyIndex) && historyIndex > 0) {\n      navigate(-1);\n      return;\n    }\n    navigate('/entreprises');\n  });"""
          if old1 not in s or old2 not in s:
              raise SystemExit('Expected B-01 patterns not found')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s)
          PY
      - run: npm run build
      - name: Commit B-01 fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/BusinessDetail.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "ux: preserve previous search on business detail back"
            git push origin HEAD:${{ github.head_ref }}
          fi

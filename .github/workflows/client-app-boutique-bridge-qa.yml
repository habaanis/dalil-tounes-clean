name: Client app Boutique bridge QA
on:
  push:
    branches:
      - fix/client-app-boutique-order-bridge-20261120
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-boutique-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check secure Boutique bridge contracts
        run: node scripts/test-client-app-boutique-order-bridge.mjs
      - name: Build client preview (no publish)
        run: npm run build

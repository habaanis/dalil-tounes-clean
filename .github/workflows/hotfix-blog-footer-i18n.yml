name: Hotfix Blog Footer i18n

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'hotfix-blog-footer-i18n-20260824'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-blog-footer-i18n-20260824
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Localize footer slogan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/Footer.tsx')
          s = p.read_text()
          s = s.replace("    request: 'Demande d’information / inscription',", "    request: 'Demande d’information / inscription',\n    slogan: 'Ne soyez pas seulement présent, soyez trouvable.',")
          s = s.replace("    request: 'طلب معلومات / تسجيل',", "    request: 'طلب معلومات / تسجيل',\n    slogan: 'لا تكتفِ بالحضور، كن سهل العثور عليك.',")
          s = s.replace("    request: 'Information request / registration',", "    request: 'Information request / registration',\n    slogan: 'Do not just be present, be easy to find.',")
          s = s.replace("    request: 'Richiesta di informazioni / registrazione',", "    request: 'Richiesta di informazioni / registrazione',\n    slogan: 'Non limitarti a essere presente, fatti trovare.',")
          s = s.replace("    request: 'Запрос информации / регистрация',", "    request: 'Запрос информации / регистрация',\n    slogan: 'Не просто присутствуйте — будьте заметны и доступны для поиска.',")
          s = s.replace('{t.home.footerVisibility.text}', '{staticCopy.slogan}')
          p.write_text(s)
          PY
      - run: npm run build
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Footer.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "i18n: localize global footer slogan"
          git push origin HEAD:hotfix-blog-footer-i18n-20260824

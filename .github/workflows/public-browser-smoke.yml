name: Public browser navigation smoke test
on:
  workflow_dispatch:
  schedule:
    - cron: '25 4 * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/smoke-browser.mjs'
      - '.github/workflows/public-browser-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3fdf2b5b7f
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.58.0
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:browser
        env:
          SMOKE_BASE_URL: https://dalil-tounes.com

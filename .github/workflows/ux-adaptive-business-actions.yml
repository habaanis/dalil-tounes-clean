name: Validate adaptive CV Business actions

on:
  push:
    branches: [ux-adaptive-business-actions-20260825]

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-adaptive-business-actions-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Make business actions data-aware
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/BusinessShowcaseLienoraDetail.tsx')
          s = p.read_text()
          old = """    mapsUrl && {\n      label: text.directions,\n      href: mapsUrl,\n      icon: Navigation,\n      external: true,\n    },\n  ].filter((action): action is ActionConfig => Boolean(action));\n"""
          new = """    mapsUrl && {\n      label: text.directions,\n      href: mapsUrl,\n      icon: Navigation,\n      external: true,\n    },\n    websiteUrl && {\n      label: text.website,\n      href: websiteUrl,\n      icon: Globe2,\n      external: true,\n    },\n  ].filter((action): action is ActionConfig => Boolean(action));\n"""
          if old not in s:
              raise SystemExit('Primary actions block not found')
          s = s.replace(old, new, 1)

          old = """            <div className=\"dt-secondary-actions\">\n              <button\n                type=\"button\"\n                className=\"dt-secondary-action\"\n                onClick={capabilities.showReservation ? openBooking : requestQuote}\n              >\n                {capabilities.showReservation\n                  ? <CalendarDays aria-hidden=\"true\" />\n                  : <FileText aria-hidden=\"true\" />}\n                {capabilities.showReservation ? text.book : text.requestQuote}\n              </button>\n              <button type=\"button\" className=\"dt-secondary-action\" onClick={downloadContact}>\n                <Contact aria-hidden=\"true\" />{text.addContact}\n              </button>\n            </div>\n"""
          new = """            <div className=\"dt-secondary-actions\">\n              {(capabilities.showReservation || whatsappUrl || business.email) && (\n                <button\n                  type=\"button\"\n                  className=\"dt-secondary-action\"\n                  onClick={capabilities.showReservation ? openBooking : requestQuote}\n                >\n                  {capabilities.showReservation\n                    ? <CalendarDays aria-hidden=\"true\" />\n                    : <FileText aria-hidden=\"true\" />}\n                  {capabilities.showReservation ? text.book : text.requestQuote}\n                </button>\n              )}\n              <button type=\"button\" className=\"dt-secondary-action\" onClick={downloadContact}>\n                <Contact aria-hidden=\"true\" />{text.addContact}\n              </button>\n            </div>\n"""
          if old not in s:
              raise SystemExit('Secondary actions block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - run: npm run build
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/BusinessShowcaseLienoraDetail.tsx
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "ux: adapt CV Business actions to available data"
            git push origin HEAD:ux-adaptive-business-actions-20260825
          fi

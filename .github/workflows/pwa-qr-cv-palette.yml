name: PWA QR/CV palette parity
on:
  push:
    branches:
      - fix/pwa-qr-cv-palette-consistency-20261116
  pull_request:
    paths:
      - src/pages/BusinessQr.tsx
      - src/components/BusinessShowcaseLienoraDetail.tsx
      - src/lib/cvPalette.ts
      - scripts/test-pwa-qr-cv-palette-consistency.mjs
permissions:
  contents: read
jobs:
  palette:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/test-pwa-qr-cv-palette-consistency.mjs
      - run: npm run build

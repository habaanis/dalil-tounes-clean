name: Localize CultureEvents empty states

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/fix-culture-events-i18n.yml'
  push:
    branches:
      - i18n-public-sections-20260824
    paths:
      - '.github/workflows/fix-culture-events-i18n.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n-public-sections-20260824
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Replace remaining direct empty states
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'src/pages/CultureEvents.tsx';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace('<p>Aucun événement cette semaine</p>', '<p>{t.noEvents}</p>');
          s = s.replace('<p>Aucun événement ce mois-ci</p>', '<p>{t.noEvents}</p>');
          s = s.replace('<p>Aucun événement annuel</p>', '<p>{t.noEvents}</p>');
          fs.writeFileSync(p, s);
          NODE
      - run: npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CultureEvents.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "i18n: localize CultureEvents empty states"
          git push origin HEAD:i18n-public-sections-20260824

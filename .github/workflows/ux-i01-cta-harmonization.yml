name: UX I01 CTA Harmonization

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'ux-i01-cta-harmonization-20260824'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-i01-cta-harmonization-20260824
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Harmonize professional CTAs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path('src/pages/HomeVitrineFirst.tsx')
          s = home.read_text()
          replacements = {
            "primary: 'Créer ma Vitrine Business',": "primary: 'Découvrir les offres',",
            "primary: 'أنشئ واجهتي المهنية',": "primary: 'اكتشف العروض',",
            "primary: 'Create my Business Showcase',": "primary: 'Discover the offers',",
            "primary: 'Crea la mia Vetrina Business',": "primary: 'Scopri le offerte',",
            "primary: 'Создать мою Business-витрину',": "primary: 'Посмотреть предложения',",
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'Home CTA not found: {old}')
            s = s.replace(old, new, 1)
          home.write_text(s)

          sub = Path('src/pages/Subscription.tsx')
          s = sub.read_text()
          replacements = {
            "requestCreation: 'Demander la création',": "requestCreation: 'Demander la création de mon CV Business',",
            "requestCreation: 'اطلب الإنشاء',": "requestCreation: 'اطلب إنشاء CV Business الخاص بي',",
            "requestCreation: 'Request creation',": "requestCreation: 'Request my Business CV creation',",
            "requestCreation: 'Richiedi la creazione',": "requestCreation: 'Richiedi la creazione del mio CV Business',",
            "requestCreation: 'Запросить создание',": "requestCreation: 'Заказать создание моего Business CV',",
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'Subscription CTA not found: {old}')
            s = s.replace(old, new, 1)
          sub.write_text(s)
          PY
      - run: npm run build
      - name: Commit I-01 fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/HomeVitrineFirst.tsx src/pages/Subscription.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ux: harmonize professional CTAs"
          git push origin HEAD:ux-i01-cta-harmonization-20260824

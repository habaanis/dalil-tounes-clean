name: UX S03 Artisan Audience

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'ux-s03-artisan-audience-20260824'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-s03-artisan-audience-20260824
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Clarify Artisan audience
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/pages/Subscription.tsx')
          s = p.read_text()
          replacements = [
            "Pour les artisans, indépendants, commerçants et petites activités qui veulent des outils pratiques pour gérer et développer leur présence.",
            "للحرفيين والمستقلين والتجار والأنشطة الصغيرة الذين يريدون أدوات عملية لإدارة حضورهم وتطويره.",
            "For craftspeople, independent professionals, shop owners and small businesses that want practical tools to manage and grow their presence.",
            "Per artigiani, professionisti indipendenti, commercianti e piccole attività che vogliono strumenti pratici per gestire e sviluppare la propria presenza.",
            "Для мастеров, независимых специалистов, продавцов и малого бизнеса, которым нужны практичные инструменты для управления и развития своего присутствия.",
          ]
          matches = list(re.finditer(r"artisanIntro:\s*'[^']*'", s))
          if len(matches) != 5:
            raise SystemExit(f'Expected 5 artisanIntro entries, found {len(matches)}')
          parts = []
          last = 0
          for match, value in zip(matches, replacements):
            parts.append(s[last:match.start()])
            parts.append("artisanIntro: '" + value + "'")
            last = match.end()
          parts.append(s[last:])
          p.write_text(''.join(parts))
          PY
      - run: npm run build
      - name: Commit S-03 fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Subscription.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ux: clarify Artisan plan audience"
          git push origin HEAD:ux-s03-artisan-audience-20260824

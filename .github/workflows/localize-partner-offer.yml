name: Localize PartnerSearch offer

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/localize-partner-offer.yml'
  push:
    branches:
      - i18n-public-sections-20260824
    paths:
      - '.github/workflows/localize-partner-offer.yml'

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n-public-sections-20260824
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Connect offer translations
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'src/pages/PartnerSearch.tsx';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace("import { useTranslation } from '../lib/i18n';", "import { useTranslation } from '../lib/i18n';\nimport { getPartnerSearchOfferTranslations } from '../lib/partnerSearchOfferTranslations';");
          s = s.replace('  const t = useTranslation(language);', '  const t = useTranslation(language);\n  const offerT = getPartnerSearchOfferTranslations(language);');
          s = s.replaceAll('<span className="text-sm">Envoi en cours...</span>', '<span className="text-sm">{offerT.sending}</span>');
          s = s.replaceAll('<span>Envoi en cours...</span>', '<span>{offerT.sending}</span>');
          s = s.replaceAll('<span className="text-sm font-medium">Erreur lors de l\'envoi</span>', '<span className="text-sm font-medium">{offerT.sendError}</span>');
          s = s.replace('<h3 className="text-lg font-semibold text-[#4A1D43]">Proposer mes services</h3>', '<h3 className="text-lg font-semibold text-[#4A1D43]">{offerT.title}</h3>');
          s = s.replace('Nom de l\'entreprise <span className="text-[#800020]">*</span>', '{offerT.company} <span className="text-[#800020]">*</span>');
          s = s.replace('placeholder="Votre entreprise"', 'placeholder={offerT.companyPlaceholder}');
          s = s.replace('Secteur d\'activité <span className="text-[#800020]">*</span>', '{offerT.sector} <span className="text-[#800020]">*</span>');
          s = s.replace('<option value="">Sélectionnez</option>', '<option value="">{offerT.select}</option>');
          for (const key of ['informatique','marketing','finance','juridique','construction','design','formation','sante','commerce','logistique','autre']) {
            const re = new RegExp(`<option value="${key}">[^<]*<\\/option>`);
            s = s.replace(re, `<option value="${key}">{offerT.sectors.${key}}</option>`);
          }
          s = s.replace('Description de vos services <span className="text-[#800020]">*</span>', '{offerT.description} <span className="text-[#800020]">*</span>');
          s = s.replace('placeholder="Décrivez vos services, expertise, points forts..."', 'placeholder={offerT.descriptionPlaceholder}');
          s = s.replace('                        Site web / Portfolio', '                        {offerT.website}');
          s = s.replace("                        Années d'expérience", '                        {offerT.experience}');
          s = s.replace('placeholder="https://votre-site.com"', 'placeholder="https://example.com"');
          s = s.replace('placeholder="votre@email.com"', 'placeholder={offerT.emailPlaceholder}');
          s = s.replace('Téléphone <span className="text-[#800020]">*</span>', '{offerT.phone} <span className="text-[#800020]">*</span>');
          s = s.replace('Ville / Région <span className="text-[#800020]">*</span>', '{offerT.city} <span className="text-[#800020]">*</span>');
          s = s.replace('<span>Envoyer mon offre</span>', '<span>{offerT.send}</span>');
          s = s.replace('<span className="text-sm">Votre offre a bien été envoyée, merci !</span>', '<span className="text-sm">{offerT.success}</span>');
          fs.writeFileSync(p, s);
          NODE
      - run: npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PartnerSearch.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "i18n: localize PartnerSearch service offer"
          git push origin HEAD:i18n-public-sections-20260824
# trigger

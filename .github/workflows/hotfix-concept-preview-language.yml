name: Hotfix Concept preview language

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'hotfix-concept-preview-language-20260824'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-concept-preview-language-20260824
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply language prop to Concept previews
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/Concept.tsx')
          s = p.read_text()
          s = s.replace("function StepIllustration({ type, t }: { type: string | null; t: ConceptCopy }) {", "function StepIllustration({ type, t, language }: { type: string | null; t: ConceptCopy; language: Language }) {")
          s = s.replace("if (type === 'businesscard') return <BusinessCardPreview variant=\"artisan\" size=\"compact\" interactive={false} />;", "if (type === 'businesscard') return <BusinessCardPreview variant=\"artisan\" size=\"compact\" interactive={false} language={language} />;")
          s = s.replace("if (type === 'cvbusiness') return <BusinessCardPreview variant=\"premium\" size=\"compact\" interactive={false} />;", "if (type === 'cvbusiness') return <BusinessCardPreview variant=\"premium\" size=\"compact\" interactive={false} language={language} />;")
          s = s.replace("<StepIllustration type={step.component} t={t} />", "<StepIllustration type={step.component} t={t} language={language} />")
          p.write_text(s)
          PY
      - run: npm run build
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Concept.tsx
          git commit -m "i18n: pass language to Concept business previews"
          git push origin HEAD:hotfix-concept-preview-language-20260824

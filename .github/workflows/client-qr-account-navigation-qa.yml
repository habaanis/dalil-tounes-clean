name: Client mini-app QR and account navigation QA
on:
  push:
    branches:
      - fix/client-qr-account-navigation-preview-20261119
  pull_request:
    paths:
      - src/pages/ClientAccount.tsx
      - src/components/BusinessShowcaseLienoraDetail.tsx
      - src/components/auth/LoginForm.tsx
      - scripts/test-client-qr-account-navigation-preview.mjs
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Navigation contract checks
        run: node scripts/test-client-qr-account-navigation-preview.mjs
      - name: Build client mini-app
        run: npm run build

name: Localize job match pages

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/localize-job-match-pages.yml'
  push:
    branches:
      - i18n-public-sections-20260824
    paths:
      - '.github/workflows/localize-job-match-pages.yml'

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n-public-sections-20260824
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Localize candidate recommendations
        run: |
          node - <<'NODE'
          const fs = require('fs');
          let p='src/pages/CandidateJobMatches.tsx';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace("import { useTranslation } from '../lib/i18n';", "import { getCandidateJobMatchTranslations } from '../lib/jobMatchPageTranslations';");
          s=s.replace('  const t = useTranslation(language);','  const t = getCandidateJobMatchTranslations(language);');
          const reps=[
            ["setError('Vous devez être connecté pour voir vos recommandations');","setError(t.login);"],
            ["setError('Aucun profil candidat trouvé. Veuillez créer votre profil candidat d\\'abord.');","setError(t.noProfile);"],
            ["setError(err.message || 'Erreur lors du chargement des recommandations');","setError(err.message || t.loadError);"],
            ["text: 'Vous avez déjà postulé à cette offre'","text: t.already"],
            ["text: 'Candidature envoyée avec succès !'","text: t.success"],
            ["text: 'Erreur lors de l\\'envoi de la candidature'","text: t.applyError"],
            ['<p className="text-gray-600">Chargement de vos recommandations...</p>','<p className="text-gray-600">{t.loading}</p>'],
            ['<h3 className="font-bold mb-2">Erreur</h3>','<h3 className="font-bold mb-2">{t.error}</h3>'],
            ['Créer mon profil candidat','{t.createProfile}'],
            ['            Offres recommandées pour vous','            {t.title}'],
            ["            Découvrez les offres d'emploi qui correspondent le mieux à votre profil",'            {t.subtitle}'],
            ['              Aucune offre correspondante pour le moment','              {t.empty}'],
            ['              Complétez votre profil et ajoutez plus de compétences pour améliorer vos recommandations.','              {t.emptyHint}'],
            ['<span className="font-medium text-blue-900">Pourquoi cette offre ? </span>','<span className="font-medium text-blue-900">{t.why} </span>'],
            [' TND/mois',' {t.salaryMonth}'],
            ["                      Voir l'offre",'                      {t.view}'],
            ['<span>En cours...</span>','<span>{t.working}</span>'],
            ['<span>Postuler</span>','<span>{t.apply}</span>']
          ];
          for(const [a,b] of reps) s=s.split(a).join(b);
          s=s.replace('<div className="min-h-screen bg-gradient-to-br from-orange-50 via-white to-red-50 py-12">','<div className="min-h-screen bg-gradient-to-br from-orange-50 via-white to-red-50 py-12" dir={language === \'ar\' ? \'rtl\' : \'ltr\'}>');
          fs.writeFileSync(p,s);
          NODE
      - name: Localize company candidate matches
        run: |
          node - <<'NODE'
          const fs = require('fs');
          let p='src/pages/JobCandidateMatches.tsx';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace("import { useTranslation } from '../lib/i18n';", "import { getCompanyJobMatchTranslations } from '../lib/jobMatchPageTranslations';");
          s=s.replace('  const t = useTranslation(language);','  const t = getCompanyJobMatchTranslations(language);');
          const reps=[
            ["setError('Vous devez être connecté pour voir les candidats');","setError(t.login);"],
            ["setError('Offre d\\'emploi non trouvée');","setError(t.notFound);"],
            ["setError('Vous n\\'avez pas accès aux candidats de cette offre');","setError(t.forbidden);"],
            ["setError(err.message || 'Erreur lors du chargement des candidats');","setError(err.message || t.loadError);"],
            ["if (years === 0) return 'Débutant';","if (years === 0) return t.beginner;"],
            ["if (years === 1) return '1 an d\\'expérience';","if (years === 1) return t.oneYear;"],
            ["return `${years} ans d'expérience`;","return `${years} ${t.years}`;"],
            ['<p className="text-gray-600">Recherche des candidats correspondants...</p>','<p className="text-gray-600">{t.loading}</p>'],
            ['<h3 className="font-bold mb-2">Erreur</h3>','<h3 className="font-bold mb-2">{t.error}</h3>'],
            ['            Candidats correspondants','            {t.title}'],
            ["            Pour l'offre :",'            {t.forJob}'],
            ['              Aucun candidat correspondant pour le moment','              {t.empty}'],
            ['              Les candidats dont le profil correspond apparaîtront ici automatiquement.','              {t.emptyHint}'],
            ['<span className="font-medium text-blue-900">Pourquoi ce candidat ? </span>','<span className="font-medium text-blue-900">{t.why} </span>'],
            ['<span>Contacter</span>','<span>{t.contact}</span>'],
            ['                  Contacter {showContactForm.full_name}','                  {t.contactTitle} {showContactForm.full_name}'],
            ['                  <strong>Note :</strong> Cette fonctionnalité de messagerie est en cours de développement.\n                  Pour le moment, le message sera simulé.','                  <strong>{t.note}</strong> {t.noteText}'],
            ['placeholder="Votre message..."','placeholder={t.messagePlaceholder}'],
            ['                    Annuler','                    {t.cancel}'],
            ['<span>Envoi...</span>','<span>{t.sending}</span>'],
            ['<span>Envoyer</span>','<span>{t.send}</span>'],
            ["alert('Fonctionnalité de messagerie en cours de développement. Le candidat sera notifié prochainement.');","alert(t.devMessage);"],
            ["alert('Erreur lors de l\\'envoi du message');","alert(t.sendError);"]
          ];
          for(const [a,b] of reps) s=s.split(a).join(b);
          s=s.replace('<div className="min-h-screen bg-gradient-to-br from-orange-50 via-white to-red-50 py-12">','<div className="min-h-screen bg-gradient-to-br from-orange-50 via-white to-red-50 py-12" dir={language === \'ar\' ? \'rtl\' : \'ltr\'}>');
          fs.writeFileSync(p,s);
          NODE
      - run: npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CandidateJobMatches.tsx src/pages/JobCandidateMatches.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "i18n: localize job matching pages"
          git push origin HEAD:i18n-public-sections-20260824
# trigger

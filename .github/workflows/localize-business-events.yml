name: Localize BusinessEvents

on:
  push:
    branches:
      - i18n-public-sections-20260824
    paths:
      - 'scripts/localize-business-events.mjs'
      - '.github/workflows/localize-business-events.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/localize-business-events.mjs'
      - '.github/workflows/localize-business-events.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n-public-sections-20260824
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/localize-business-events.mjs
      - run: npm run build
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/BusinessEvents.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "i18n: localize BusinessEvents page"
          git push origin HEAD:i18n-public-sections-20260824

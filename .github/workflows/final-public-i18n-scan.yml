name: Final public i18n scan

on:
  push:
    branches:
      - i18n-public-sections-20260824
    paths:
      - 'scripts/final-public-i18n-scan.mjs'
      - '.github/workflows/final-public-i18n-scan.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/final-public-i18n-scan.mjs'
      - '.github/workflows/final-public-i18n-scan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n-public-sections-20260824
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/final-public-i18n-scan.mjs
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/final-public-i18n-scan.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: add final public i18n scan report"
          git push origin HEAD:i18n-public-sections-20260824
# current-state rescan

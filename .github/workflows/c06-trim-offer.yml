name: Validate C-06 offer trim

on:
  push:
    branches: [ux-c06-premium-qr-business-20260825]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-c06-premium-qr-business-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python3 .github/scripts/c06_trim_offer.py
      - run: npm run build
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Subscription.tsx
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "marketing: keep Premium offer focused on 10 concrete benefits"
            git push origin HEAD:ux-c06-premium-qr-business-20260825
          fi

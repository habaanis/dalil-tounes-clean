name: UX A02 CV Business Naming

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'ux-a02-cv-business-naming-20260824'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-a02-cv-business-naming-20260824
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Normalize product naming
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/HomeVitrineFirst.tsx')
          s = p.read_text()
          replacements = {
            "accent: 'Créez votre Vitrine Business professionnelle.',": "accent: 'Créez votre CV Business professionnel.',",
            "accent: 'أنشئ واجهة Business احترافية.',": "accent: 'أنشئ CV Business احترافيًا.',",
            "accent: 'Create your professional Business Showcase.',": "accent: 'Create your professional Business CV.',",
            "accent: 'Crea la tua Vetrina Business professionale.',": "accent: 'Crea il tuo CV Business professionale.',",
            "accent: 'Создайте профессиональную Business-витрину.',": "accent: 'Создайте профессиональный Business CV.',",
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'Naming anchor not found: {old}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - run: npm run build
      - name: Commit A-02 fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/HomeVitrineFirst.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ux: standardize CV Business naming"
          git push origin HEAD:ux-a02-cv-business-naming-20260824

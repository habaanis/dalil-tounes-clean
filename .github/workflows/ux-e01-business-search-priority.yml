name: UX E01 Business Search Priority

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'ux-e01-business-search-priority-20260824'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-e01-business-search-priority-20260824
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prioritize business search CTA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/pages/Businesses.tsx')
          s = p.read_text()

          primary = 'inline-flex items-center justify-center gap-2 rounded-full bg-[#D4AF37] px-6 py-3 text-sm font-bold text-[#4A1D43] shadow-lg transition hover:bg-[#F0CD5A]'
          secondary = 'inline-flex items-center justify-center gap-2 rounded-full border border-white/55 bg-white/10 px-6 py-3 text-sm font-bold text-white transition hover:bg-white/18'

          offers_pattern = re.compile(r"(onClick=\{\(\) => navigate\('/subscription'\)\}\s*\n\s*className=\")[^\"]+(\")")
          search_pattern = re.compile(r"(onClick=\{\(\) => document\.getElementById\('business-search'\)\?\.scrollIntoView\(\{ behavior: 'smooth', block: 'start' \}\)\}\s*\n\s*className=\")[^\"]+(\")")

          s2, n1 = offers_pattern.subn(r'\1' + secondary + r'\2', s, count=1)
          s3, n2 = search_pattern.subn(r'\1' + primary + r'\2', s2, count=1)

          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Expected one offers CTA and one search CTA; got offers={n1}, search={n2}. No file written.')

          if s3 == s:
              raise SystemExit('No E-01 change produced.')

          p.write_text(s3)
          PY
      - run: npm run build
      - name: Commit E-01 fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Businesses.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ux: prioritize business search on Businesses hero"
          git push origin HEAD:ux-e01-business-search-priority-20260824

name: Simplify CV Business offer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.head_ref == 'offer-cv-business-creation-maintenance-20260825'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply offer architecture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/pages/Subscription.tsx')
          s = p.read_text()

          new_component = r'''const simplifiedOfferCopy: Record<OfferLanguage, {

name: Apply public i18n migration

on:
  push:
    branches:
      - i18n-public-sections-20260824
    paths:
      - 'scripts/apply-public-i18n.mjs'
      - '.github/workflows/apply-public-i18n.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: i18n-public-sections-20260824
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded i18n migration
        run: node scripts/apply-public-i18n.mjs

      - name: Build
        run: npm run build

      - name: Verify expected integration
        run: |
          grep -q "getBusinessesPageTranslations" src/pages/Businesses.tsx
          grep -q "pageT.hero.title" src/pages/Businesses.tsx
          grep -q "t.adminFinanceTitle" src/pages/CitizensAdmin.tsx
          grep -q "currentDateLocale" src/pages/CitizensLeisure.tsx

      - name: Commit validated changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Businesses.tsx src/pages/CitizensAdmin.tsx src/pages/CitizensLeisure.tsx
          git commit -m "i18n: connect public sections translations"
          git push origin HEAD:i18n-public-sections-20260824

name: Clean legacy CV Business implementation

on:
  push:
    branches: [cleanup-cv-business-preview-20260825]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-cv-business-preview-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Rename preview implementation base
        run: |
          mv src/components/BusinessCardPreviewLegacy.tsx src/components/BusinessCardPreviewBase.tsx
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/BusinessCardPreview.tsx')
          s = p.read_text()
          s = s.replace('LegacyBusinessCardPreview, {', 'BaseBusinessCardPreview, {', 1)
          s = s.replace("} from './BusinessCardPreviewLegacy';", "} from './BusinessCardPreviewBase';", 1)
          s = s.replace('<LegacyBusinessCardPreview ', '<BaseBusinessCardPreview ', 1)
          p.write_text(s)
          PY
      - name: Remove paid showcase fallback to old design
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/BusinessShowcaseLienoraDetail.tsx')
          s = p.read_text()
          s = s.replace("import { BusinessDetail as LegacyBusinessDetail } from './BusinessDetail';\n", '', 1)
          old = "  if (failed || !business) return <LegacyBusinessDetail />;\n  if (capabilities.variant === 'directory') return <LegacyBusinessDetail businessId={business.id} />;\n"
          new = """  if (failed || !business || capabilities.variant === 'directory') {\n    return (\n      <div className=\"dt-showcase-page flex items-center justify-center px-4 text-center\">\n        <div className=\"max-w-md\">\n          <p className=\"text-sm text-gray-600\">{language === 'ar' ? 'تعذر عرض هذا السجل المهني.' : language === 'en' ? 'This Business CV cannot be displayed.' : language === 'it' ? 'Questo CV Business non può essere visualizzato.' : language === 'ru' ? 'Этот Business CV не может быть отображён.' : 'Ce CV Business ne peut pas être affiché.'}</p>\n          <button type=\"button\" onClick={() => navigate('/entreprises')} className=\"mt-4 rounded-full bg-[#D4AF37] px-5 py-2 text-sm font-semibold text-white\">\n            {language === 'ar' ? 'العودة إلى البحث' : language === 'en' ? 'Back to search' : language === 'it' ? 'Torna alla ricerca' : language === 'ru' ? 'Вернуться к поиску' : 'Retour à la recherche'}\n          </button>\n        </div>\n      </div>\n    );\n  }\n"""
          if old not in s:
              raise SystemExit('Expected legacy fallback block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Confirm no legacy references remain
        run: |
          if grep -R -n BusinessCardPreviewLegacy src; then exit 1; fi
          if grep -R -n LegacyBusinessDetail src; then exit 1; fi
      - run: npm run build
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/BusinessCardPreview.tsx src/components/BusinessCardPreviewBase.tsx src/components/BusinessCardPreviewLegacy.tsx src/components/BusinessShowcaseLienoraDetail.tsx
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "refactor: remove legacy CV Business fallbacks"
            git push origin HEAD:cleanup-cv-business-preview-20260825
          fi

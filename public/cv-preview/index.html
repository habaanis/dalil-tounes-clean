<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV Business Preview — Aux saveurs d'Anis</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --gold: #D4AF37;
    --dark: #4A1D43;
    --dark2: #5A2D53;
    --cream: #FFFCF7;
    --green: #07543F;
    --gray: #6b7280;
    --light-gray: #f3f4f6;
  }
  body {
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, 'Noto Sans Arabic', sans-serif;
    background: var(--cream);
    color: #1a1a1a;
    width: 390px;
    margin: 0 auto;
    overflow-x: hidden;
  }
  .cv-card {
    background: linear-gradient(135deg, var(--dark) 0%, var(--dark2) 100%);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(74,29,67,0.15);
    border: 2px solid var(--gold);
  }
  .cv-header {
    padding: 20px 16px 14px;
    text-align: center;
    border-bottom: 1px solid rgba(212,175,55,0.3);
  }
  .cv-logo {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--cream);
    border: 3px solid var(--gold);
    margin: 0 auto 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 900; color: var(--dark);
    font-family: 'Playfair Display', serif;
  }
  .cv-business-name {
    font-size: 18px; font-weight: 800; color: #fff;
    letter-spacing: 0.02em;
  }
  .cv-trade {
    font-size: 13px; color: var(--gold);
    margin-top: 4px; font-weight: 600;
  }
  .cv-premium-badge {
    display: inline-block;
    margin-top: 8px;
    padding: 3px 12px;
    background: rgba(212,175,55,0.15);
    border: 1px solid var(--gold);
    border-radius: 20px;
    font-size: 10px; font-weight: 700; color: var(--gold);
    letter-spacing: 0.05em;
  }
  .cv-slogan {
    font-size: 11px; color: rgba(255,255,255,0.7);
    margin-top: 8px; font-style: italic;
  }
  .cv-certified {
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 8px;
    padding: 3px 10px;
    background: rgba(7,84,63,0.3);
    border-radius: 12px;
    font-size: 10px; font-weight: 700; color: #6ee7b7;
  }
  .cv-actions {
    padding: 12px 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .cv-btn {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    padding: 9px 8px;
    border-radius: 10px;
    font-size: 11px; font-weight: 700;
    text-decoration: none;
    transition: transform 0.15s;
  }
  .cv-btn:active { transform: scale(0.96); }
  .cv-btn-primary { background: var(--green); color: #fff; }
  .cv-btn-gold { background: var(--gold); color: var(--dark); }
  .cv-btn-outline { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(212,175,55,0.4); }
  .cv-btn-icon { width: 14px; height: 14px; flex-shrink: 0; }
  .cv-section {
    padding: 14px 16px;
    border-top: 1px solid rgba(212,175,55,0.15);
  background: rgba(255,255,255,0.03);
  }
  .cv-section-title {
    font-size: 12px; font-weight: 800; color: var(--gold);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .cv-section-icon { width: 15px; height: 15px; }
  .cv-presentation-text {
    font-size: 12px; color: rgba(255,255,255,0.85);
    line-height: 1.6;
  }
  .cv-read-more {
    color: var(--gold); font-size: 11px; font-weight: 600;
    margin-top: 6px; display: inline-block;
  }
  .cv-services-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  }
  .cv-service-item {
    padding: 8px 10px;
    background: rgba(255,255,255,0.06);
    border-radius: 8px;
    font-size: 11px; color: rgba(255,255,255,0.9);
    border: 1px solid rgba(212,175,55,0.15);
  }
  .cv-portfolio-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    margin-top: 4px;
  }
  .cv-portfolio-item {
    aspect-ratio: 4/3;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(74,29,67,0.4));
    border: 1px solid rgba(212,175,55,0.2);
    display: flex; align-items: flex-end;
    padding: 6px;
    font-size: 9px; color: rgba(255,255,255,0.8);
    font-weight: 600;
  }
  .cv-hours {
    font-size: 11px; color: rgba(255,255,255,0.85);
    line-height: 1.8;
  }
  .cv-hours-row { display: flex; justify-content: space-between; }
  .cv-hours-day { color: rgba(255,255,255,0.6); }
  .cv-hours-time { font-weight: 600; }
  .cv-info-grid {
    display: grid; grid-template-columns: 1fr; gap: 6px;
    font-size: 11px; color: rgba(255,255,255,0.85);
  }
  .cv-info-row { display: flex; align-items: center; gap: 6px; }
  .cv-info-icon { width: 13px; height: 13px; color: var(--gold); flex-shrink: 0; }
  .cv-qr-section {
    padding: 14px 16px;
    border-top: 1px solid rgba(212,175,55,0.15);
    display: flex; align-items: center; gap: 12px;
    background: rgba(7,84,63,0.08);
  }
  .cv-qr-box {
    width: 64px; height: 64px;
    background: #fff;
    border-radius: 10px;
    border: 2px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .cv-qr-placeholder {
    width: 48px; height: 48px;
    background: repeating-conic-gradient(#1a1a1a 0% 25%, #fff 0% 50%) 50% / 8px 8px;
    border-radius: 4px;
  }
  .cv-qr-text { flex: 1; }
  .cv-qr-title { font-size: 12px; font-weight: 800; color: var(--gold); }
  .cv-qr-sub { font-size: 10px; color: rgba(255,255,255,0.6); margin-top: 2px; }
  .cv-footer {
    padding: 10px 16px;
    text-align: center;
    font-size: 9px; color: rgba(255,255,255,0.4);
    border-top: 1px solid rgba(212,175,55,0.1);
  }
  body.rtl { direction: rtl; }
  body.rtl .cv-info-row { flex-direction: row-reverse; }
  body.rtl .cv-hours-row { flex-direction: row-reverse; }
  .portfolio-only { display: none; }
  .portfolio-mode .professional-only { display: none; }
  .portfolio-mode .portfolio-only { display: block; }
</style>
</head>
